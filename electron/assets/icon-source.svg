<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <style>
      .bg { fill: #000000; }
      .tree { fill: #1a8f45; fill-opacity: 0.32; stroke: #ffffff; stroke-opacity: 0.55; stroke-width: 2; }
      .brand { fill: #ffffff; stroke: #ffffff; stroke-width: 0.9; paint-order: stroke fill; }
      .accent { stroke: #24ff63; stroke-width: 5.2; fill: none; }
      .box { stroke: #24ff63; stroke-width: 3.2; fill: none; }
      .head { fill: #24ff63; }
    </style>
  </defs>

  <rect width="256" height="256" class="bg"/>

  <g aria-hidden="true">
    <polygon points="128,82 168,142 88,142" class="tree"/>
    <polygon points="128,104 176,178 80,178" class="tree"/>
    <rect x="122" y="178" width="12" height="20" rx="2" class="tree"/>
  </g>

  <text x="128" y="62" text-anchor="middle" class="brand" font-size="42" font-family="Segoe UI, Arial, sans-serif" font-weight="900">WSJT-X</text>

  <g>
    <line x1="48" y1="106" x2="186" y2="106" class="accent"/>
    <line x1="48" y1="130" x2="186" y2="130" class="accent"/>
    <line x1="48" y1="154" x2="186" y2="154" class="accent" stroke-dasharray="8 7"/>

    <polygon points="38,106 49,101 49,111" class="head"/>
    <polygon points="38,130 49,125 49,135" class="head"/>
    <polygon points="38,154 49,149 49,159" class="head"/>

    <polygon points="196,106 185,101 185,111" class="head"/>
    <polygon points="196,130 185,125 185,135" class="head"/>
    <polygon points="196,154 185,149 185,159" class="head"/>

    <rect x="196" y="94" width="24" height="24" rx="4" class="box"/>
    <rect x="196" y="118" width="24" height="24" rx="4" class="box"/>
    <rect x="196" y="142" width="24" height="24" rx="4" class="box"/>
  </g>

  <text x="128" y="234" text-anchor="middle" class="brand" font-size="52" font-family="Segoe UI, Arial, sans-serif" font-weight="900">Relay</text>
</svg>
