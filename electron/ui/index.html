<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.pota.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>WSJT-X Relay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container main-container">
      <div class="header">
        <div class="brand" aria-label="Application logo">
          <div id="appLogo" class="app-logo" role="img" aria-label="WSJT-X Relay logo"></div>
          <div class="brand-tagline">by W1BBT</div>
          <span class="visually-hidden">WSJT-X Relay</span>
        </div>
        <div class="station-values floating-station-values" aria-label="Station values">
          <div class="station-field">
            <span class="station-label">My Call</span>
            <h3 id="deCall" class="station-badge-value"></h3>
          </div>
          <div class="station-field">
            <span class="station-label">My Grid</span>
            <h3 id="deGrid" class="station-badge-value"></h3>
          </div>
        </div>
        <div class="header-controls header-controls-inline">
          <button id="startBtn" class="btn btn-primary">Start</button>
          <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
          <button id="settingsBtn" class="btn btn-secondary">Settings</button>
          <button id="updateBadgeBtn" class="status-badge update-badge" hidden>
            Update Available
          </button>
          <div class="theme-toggle-group">
            <span id="themeToggleIcon" class="theme-toggle-icon" title="Toggle theme">🌙</span>
            <input type="checkbox" id="themeToggle" class="theme-toggle-checkbox" />
          </div>
          <div class="status-badge" id="statusBadge">Stopped</div>
        </div>
      </div>
      <div class="status-panel">
        <h3 class="status-panel-title">
          <span id="manualQsoEntryTitle">Manual QSO Entry</span>
          <button id="toggleManualQsoBtn" class="btn btn-secondary btn-sm" type="button">
            Hide
          </button>
        </h3>
        <div id="manualQsoSection" class="qso-grid">
          <div
            class="form-group qso-field"
            data-manual-field-key="mode"
            data-manual-group="common"
          >
            <label>Mode:</label>
            <span class="qso-value">
              <select id="qso-mode">
                <option>SSB</option>
                <option>CW</option>
              </select>
            </span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="my_sig_info"
            data-manual-group="pota"
          >
            <label>My Park:</label>
            <span class="qso-value"><input type="text" id="qso-mysiginfo" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="operator"
            data-manual-group="arrl-field-day"
            hidden
          >
            <label>Operator:</label>
            <span class="qso-value"><input type="text" id="qso-operator" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="my_state"
            data-manual-group="pota"
          >
            <label>My State:</label>
            <span class="qso-value"><input type="text" id="qso-mystate" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="freq"
            data-manual-group="common"
          >
            <label>Frequency:</label>
            <span class="qso-value"><input type="number" id="qso-frequency" step="any" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="band"
            data-manual-group="common"
          >
            <label>Band:</label>
            <span class="qso-value"><input type="text" id="qso-band" disabled /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="tx_pwr"
            data-manual-group="common"
          >
            <label>TX Power:</label>
            <span class="qso-value"><input type="number" id="qso-txpwr" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="start"
            data-manual-group="common"
          >
            <label>Date On:</label>
            <span class="qso-value"><input type="text" id="qso-dateon" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="time_on"
            data-manual-group="common"
          >
            <div class="qso-field-header">
              <label>Time On:</label>
              <button id="qsoTimeNow" class="btn btn-primary btn-sm qso-time-now-btn">Now</button>
            </div>
            <span class="qso-value"><input type="text" id="qso-timeon" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="call"
            data-manual-group="common"
          >
            <div class="qso-field-header">
              <label for="qso-dxcall">DX Call:</label>
              <span id="qsoDxCallDupeTag" class="qso-manual-dupe-tag" hidden></span>
            </div>
            <span class="qso-value"><input type="text" id="qso-dxcall" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="rst_sent"
            data-manual-group="generic"
          >
            <label>RST Sent:</label>
            <span class="qso-value"><input type="text" id="qso-rst" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="rst_rcvd"
            data-manual-group="generic"
          >
            <label>RST Rcvd:</label>
            <span class="qso-value"><input type="text" id="qso-rcvd" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="state"
            data-manual-group="generic"
          >
            <label>State:</label>
            <span class="qso-value"><input type="text" id="qso-state" /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="sig_info"
            data-manual-group="pota"
          >
            <label>Their Park:</label>
            <span class="qso-value"><input type="text" id="qso-siginfo" /></span>
          </div>

          <div
            class="form-group qso-field"
            data-manual-field-key="class"
            data-manual-group="arrl-field-day"
            hidden
          >
            <label>Class:</label>
            <span class="qso-value"
              ><input type="text" id="qso-class" placeholder="e.g., 1A"
            /></span>
          </div>
          <div
            class="form-group qso-field"
            data-manual-field-key="arrl_sect"
            data-manual-group="arrl-field-day"
            hidden
          >
            <label>ARRL Section:</label>
            <span class="qso-value">
              <select id="qso-arrlsect">
                <option value="">Select Section</option>
              </select>
            </span>
          </div>

          <div class="qso-log-contact-wrap">
            <button id="qsoLogContact" class="btn btn-primary qso-log-contact-btn" disabled>
              Log Contact
            </button>
          </div>
        </div>
      </div>

      <div class="status-panel">
        <h3 class="status-panel-title">
          <span>Status Indicators</span>
          <button id="toggleStatusIndicatorsBtn" class="btn btn-secondary btn-sm" type="button">
            Hide
          </button>
        </h3>
        <div id="statusIndicatorsSection" class="indicators-grid">
          <div class="indicator">
            <label>Frequency:</label>
            <span id="frequencyValue" class="indicator-value">—</span>
          </div>
          <div class="indicator">
            <label>Mode:</label>
            <span id="modeValue" class="indicator-value">—</span>
          </div>
          <div class="indicator">
            <label>TX Enabled:</label>
            <span id="txEnabledValue" class="indicator-value indicator-off">—</span>
          </div>
          <div class="indicator indicator-transmitting-row">
            <label>Transmitting:</label>
            <div class="indicator-content">
              <span id="transmittingValue" class="indicator-value indicator-off">—</span>
              <span id="swrBadge" class="swr-badge" hidden></span>
              <span id="transmitMessage" class="transmit-message"></span>
            </div>
          </div>
          <div class="indicator indicator-listen-port-row">
            <label>Listen Port:</label>
            <div class="indicator-content">
              <span id="listenPortValue" class="indicator-value">2237</span>
              <span id="flrigConnectionBadge" class="connection-badge" hidden></span>
            </div>
          </div>
          <div class="indicator">
            <label>Forwards:</label>
            <span id="forwardsValue" class="indicator-value">None configured</span>
          </div>
        </div>
      </div>

      <div class="log-section">
        <div class="log-panel">
          <h2 class="log-panel-title-row">
            <span>Activity Log</span>
            <div class="activity-log-tools">
              <span
                class="activity-log-rx"
                aria-label="Packet activity indicator"
                title="Blinks when packets are received"
              >
                <span
                  id="activityRxIndicator"
                  class="activity-log-rx-dot"
                  aria-hidden="true"
                ></span>
                RX
              </span>
              <span class="activity-log-filter-label">Packets:</span>
              <div class="activity-log-options">
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="Heartbeat"
                    checked
                  />Heartbeat</label
                >
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="Status"
                    checked
                  />Status</label
                >
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="Decode"
                    checked
                  />Decode</label
                >
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="QSO Logged"
                    checked
                  />QSO Logged</label
                >
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="Logged ADIF"
                    checked
                  />Logged ADIF</label
                >
                <label class="activity-log-filter-item"
                  ><input
                    type="checkbox"
                    class="activity-packet-filter"
                    value="SYSTEM"
                    checked
                  />System/Other</label
                >
              </div>
            </div>
          </h2>
          <div class="log-container" id="logContainer"></div>
          <div class="log-panel-footer">
            <button id="clearLogBtn" class="btn btn-danger log-panel-footer-btn">Clear Log</button>
          </div>
        </div>
        <div class="log-panel">
          <h2 class="log-panel-title-row">
            <span>QSO Log <span id="qsoCount">(0)</span></span>
            <div class="qso-log-tools">
              <input
                type="text"
                id="qsoFilterCall"
                placeholder="Filter by call"
                aria-label="Filter QSOs by call"
              />
              <span id="qsoTodayUtc" class="qso-log-count-meta">Today: 0</span>
              <span id="qsoLastHour" class="qso-log-count-meta">Last Hour: 0</span>
            </div>
          </h2>
          <div class="log-container" id="qsoContainer">
            <div class="qso-log-entry qso-log-header">
              <span>Timestamp</span>
              <span>DX Call</span>
              <span>Mode</span>
              <span>Freq</span>
              <span>Band</span>
              <span>Pwr</span>
              <span>Tags</span>
            </div>
          </div>
          <div class="log-panel-footer">
            <button id="clearQsoBtn" class="btn btn-danger log-panel-footer-btn">Clear Log</button>
            <button id="qsoEditorBtn" class="btn btn-secondary log-panel-footer-btn">
              QSO Editor
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="qso-fields.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
