<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POTA Spots</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="pota-spots-wrapper">
      <div class="pota-spots-header">
        <h1>POTA Spots</h1>
        <div class="pota-spots-controls">
          <div class="pota-filter-group">
            <label for="modeFilter">Mode:</label>
            <select id="modeFilter" class="pota-filter-select">
              <option value="">All Modes</option>
            </select>
          </div>
          <div class="pota-filter-group">
            <label for="bandFilter">Band:</label>
            <select id="bandFilter" class="pota-filter-select">
              <option value="">All Bands</option>
            </select>
          </div>
          <div class="pota-filter-group">
            <label for="regionFilter">Region (First 2 chars):</label>
            <input 
              type="text" 
              id="regionFilter" 
              class="pota-filter-input" 
              placeholder="e.g., US, EU"
              maxlength="2"
            />
          </div>
          <div class="pota-filter-group">
            <button id="refreshBtn" class="btn btn-primary">Refresh Now</button>
            <span id="lastUpdateTime" class="pota-last-update"></span>
          </div>
        </div>
      </div>

      <div class="pota-spots-content">
        <div id="spotsTableContainer" class="pota-spots-table-container">
          <table class="pota-spots-table">
            <thead>
              <tr>
                <th data-field="activator">Activator</th>
                <th data-field="frequency">Frequency</th>
                <th data-field="mode">Mode</th>
                <th data-field="reference">Reference</th>
                <th data-field="name">Name</th>
                <th data-field="locationDesc">Location</th>
                <th data-field="spotTime">Spot Time</th>
              </tr>
            </thead>
            <tbody id="spotsTableBody">
              <!-- Spots will be inserted here -->
            </tbody>
          </table>
          <div id="noSpotsMessage" class="pota-no-spots" style="display: none;">
            No spots found. Click "Refresh Now" to fetch POTA spots.
          </div>
        </div>
      </div>
    </div>

    <script src="pota-spots.js"></script>
  </body>
</html>
