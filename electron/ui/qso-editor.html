<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.pota.app; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>QSO Editor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="qso-editor-wrapper">
      <div class="qso-editor-header">
        <h1>QSO Editor</h1>
        <div class="qso-editor-filter">
          <input
            type="text"
            id="callsignFilterInput"
            class="qso-filter-input"
            placeholder="Filter by callsign..."
            autocomplete="off"
          />
        </div>
      </div>

      <div class="qso-editor-content">
        <div id="qsoListContainer" class="qso-editor-list"></div>
      </div>

      <div class="qso-editor-footer">
        <div class="qso-editor-footer-group">
          <button id="importQsosBtn" class="btn btn-secondary">Import ADIF</button>
          <button id="exportQsosBtn" class="btn btn-secondary">Export ADIF</button>
          <button id="resendAllQsosBtn" class="btn btn-secondary">Resend All</button>
          <button id="setMyParkBtn" class="btn btn-secondary">Set My Park</button>
          <button id="addBlankQsoBtn" class="btn btn-secondary">Add Blank QSO</button>
        </div>
        <div class="qso-editor-footer-group">
          <button id="saveQsoChanges" class="btn btn-primary">Save All Changes</button>
          <button id="cancelQsoChanges" class="btn btn-secondary">Close</button>
        </div>
      </div>
    </div>

    <div id="rawDataModal" class="qso-raw-modal" hidden>
      <div class="qso-raw-modal-backdrop" data-action="close-raw-modal"></div>
      <div
        class="qso-raw-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="rawDataModalTitle"
      >
        <div class="qso-raw-modal-header">
          <h2 id="rawDataModalTitle">Raw QSO Data</h2>
          <button id="closeRawDataModalBtn" class="btn btn-secondary btn-sm" type="button">
            Close
          </button>
        </div>
        <div id="rawDataModalContent" class="qso-raw-modal-content"></div>
      </div>
    </div>

    <div id="setMyParkModal" class="qso-raw-modal" hidden>
      <div class="qso-raw-modal-backdrop" data-action="close-park-modal"></div>
      <div
        class="qso-raw-modal-dialog set-park-modal-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="setParkModalTitle"
      >
        <div class="qso-raw-modal-header">
          <h2 id="setParkModalTitle">Set My Park</h2>
          <button id="closeParkModalBtn" class="btn btn-secondary btn-sm" type="button">
            Cancel
          </button>
        </div>
        <div class="qso-raw-modal-content set-park-modal-content">
          <p class="set-park-help-text">
            Enter your Park reference (e.g., US-1234 or K-12345)
          </p>
          <input
            type="text"
            id="parkReferenceInput"
            class="set-park-input"
            placeholder="XX-####"
          />
          <p id="parkValidationError" class="set-park-error"></p>
          <div class="set-park-actions">
            <button id="cancelParkBtn" class="btn btn-secondary">Cancel</button>
            <button id="confirmParkBtn" class="btn btn-primary">Set Park</button>
          </div>
        </div>
      </div>
    </div>

    <script src="qso-fields.js"></script>
    <script src="qso-editor.js"></script>
  </body>
</html>
